<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js" defer></script>

    <div class="container">
        <div class="screen"></div>
        <div class="buttons">
            <div id="clear">CLEAR</div>
            <div id="delete">DELETE</div>
        </div>
        <div class="buttons">
            <div class="firstrow">
                <div>7</div>
                <div>8</div>
                <div>9</div>
                <div>÷</div>
            </div>
                <div class="secondrow">
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div>x</div>
            </div>
                <div class="thirdrow">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>-</div>
            </div>
                <div class="fourthrow">
                <div>.</div>
                <div>0</div>
                <div>=</div>
                <div>+</div>
            </div>
        </div>
    </div>
</body>
</html>
